<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pose Follow Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TensorFlow.js and Teachable Machine Pose Library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .pulse-glow {
            animation: pulse-glow 1.5s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
            100% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.8); }
        }
        .canvas-overlay {
            transform: scaleX(-1); /* Mirror camera output */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <header class="max-w-6xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center bg-slate-800/80 p-4 rounded-2xl backdrop-blur-md border border-slate-700 mb-6 gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-3 rounded-xl">
                <i class="fa-solid fa-person-running text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">AI 동작 따라하기 게임</h1>
                <p class="text-xs text-slate-400">영상을 보며 정해진 구간에서 올바른 포즈를 취하세요!</p>
            </div>
        </div>

        <!-- Score & Combo Display -->
        <div class="flex gap-6 items-center bg-slate-900/90 px-6 py-2 rounded-xl border border-slate-700">
            <div class="text-center">
                <span class="text-xs text-slate-400 block uppercase font-semibold">점수</span>
                <span id="score-text" class="text-3xl font-extrabold text-amber-400">0</span>
            </div>
            <div class="h-8 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="text-xs text-slate-400 block uppercase font-semibold">콤보</span>
                <span id="combo-text" class="text-2xl font-bold text-emerald-400">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow">
        
        <!-- Left Column: YouTube Video Player & Current Action Cue -->
        <div class="flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 flex flex-col justify-between shadow-xl">
                <div class="flex justify-between items-center mb-3">
                    <span class="font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-brands fa-youtube text-red-500 text-lg"></i> 비디오 가이드
                    </span>
                    <span id="time-display" class="font-mono text-sm bg-slate-900 px-3 py-1 rounded-lg text-slate-300">00:00</span>
                </div>
                
                <!-- YouTube iframe Container -->
                <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black border border-slate-700">
                    <div id="player"></div>
                </div>

                <!-- Current Expected Pose Indicator -->
                <div class="mt-4 bg-slate-900 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
                    <div>
                        <span class="text-xs text-slate-400 block mb-1">현재 필요한 동작</span>
                        <span id="expected-pose" class="text-xl font-bold text-indigo-400">대기 중...</span>
                    </div>
                    <div id="match-badge" class="px-4 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700">
                        준비중
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Webcam & AI Pose Matching Display -->
        <div class="flex flex-col gap-4">
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 flex flex-col justify-between shadow-xl h-full">
                <div class="flex justify-between items-center mb-3">
                    <span class="font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-camera text-indigo-400"></i> 내 카메라 (AI 인지 중)
                    </span>
                    <span id="status-tag" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                        모델 로딩 대기
                    </span>
                </div>

                <!-- Webcam Canvas Box -->
                <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black border border-slate-700 flex items-center justify-center">
                    <canvas id="canvas" class="w-full h-full object-cover canvas-overlay"></canvas>
                    
                    <!-- Loading Overlay -->
                    <div id="webcam-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 gap-3 text-center p-4">
                        <i class="fa-solid fa-head-side-goggles text-4xl text-indigo-400 animate-bounce"></i>
                        <p class="text-slate-300 font-medium">카메라 및 AI 모델을 시작해주세요</p>
                        <p class="text-xs text-slate-500 max-w-xs">카메라 권한을 허용해야 AI가 동작을 감지할 수 있습니다.</p>
                    </div>
                </div>

                <!-- Detected Pose Confidence Bars -->
                <div id="probability-container" class="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-2 bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <!-- Probability items inserted dynamically -->
                </div>
            </div>
        </div>
    </main>

    <footer class="max-w-6xl mx-auto w-full mt-6 bg-slate-800 p-4 rounded-2xl border border-slate-700 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <button id="start-btn" onclick="initGame()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold rounded-xl shadow-lg transition flex items-center gap-2">
                <i class="fa-solid fa-play"></i> 게임 시작하기
            </button>
            <button id="reset-btn" onclick="resetGame()" class="px-4 py-3 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 font-semibold rounded-xl transition">
                <i class="fa-solid fa-rotate-left"></i> 리셋
            </button>
        </div>

        <!-- Instructions -->
        <div class="text-xs text-slate-400 text-center md:text-right">
            <p><i class="fa-solid fa-circle-info text-indigo-400"></i> 각 구간에 맞춰 웹캠 앞에서 해당 포즈를 유지하면 점수가 획득됩니다!</p>
            <p class="text-slate-500">인식 포즈: REST | SAY HI | WALK | SWING | PAW | JUMP</p>
        </div>
    </footer>

    <script>
        // Teachable Machine URL provided by user
        const URL = "https://teachablemachine.withgoogle.com/models/PHWApIz6k/";
        let model, webcam, ctx, maxPredictions;

        // Timeline Schedule for Actions in Video (in Seconds)
        // Adjust timestamps according to the specific video content timeline if necessary
        const POSE_TIMELINE = [
            { pose: "REST", start: 0, end: 5 },
            { pose: "SAY HI", start: 5, end: 15 },
            { pose: "WALK", start: 15, end: 30 },
            { pose: "SWING", start: 30, end: 45 },
            { pose: "PAW", start: 45, end: 60 },
            { pose: "JUMP", start: 60, end: 75 },
            { pose: "REST", start: 75, end: 300 }
        ];

        // Game State Variables
        let score = 0;
        let combo = 0;
        let isGameRunning = false;
        let currentExpectedPose = "REST";
        let lastScoreTime = 0;

        // YouTube Player API Async Loading
        let player;
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: 'oRr5hxr_bRA', // Provided YouTube Video ID
                playerVars: {
                    'playsinline': 1,
                    'controls': 1,
                    'modestbranding': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // Can sync AI loop with Video play/pause if required
        }

        async function initGame() {
            const startBtn = document.getElementById("start-btn");
            const statusTag = document.getElementById("status-tag");
            
            startBtn.disabled = true;
            startBtn.classList.add("opacity-50", "cursor-not-allowed");
            statusTag.innerText = "모델 및 카메라 로딩 중...";

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // Load Teachable Machine Pose Model
                model = await tmPose.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Setup Webcam
                const size = 400;
                const flip = true;
                webcam = new tmPose.Webcam(size, size, flip);
                await webcam.setup();
                await webcam.play();

                // Setup Canvas
                const canvas = document.getElementById("canvas");
                canvas.width = size;
                canvas.height = size;
                ctx = canvas.getContext("2d");

                document.getElementById("webcam-placeholder").classList.add("hidden");
                statusTag.innerText = "게임 진행 중";
                statusTag.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";

                // Play YouTube Video
                if (player && typeof player.playVideo === 'function') {
                    player.playVideo();
                }

                // Render Probability Structure UI
                initProbabilityUI();

                isGameRunning = true;
                window.requestAnimationFrame(gameLoop);

            } catch (error) {
                console.error("AI 모델 초기화 실패:", error);
                alert("카메라 또는 모델을 로드하는데 실패했습니다. 권한을 확인해주세요.");
                startBtn.disabled = false;
                startBtn.classList.remove("opacity-50", "cursor-not-allowed");
                statusTag.innerText = "오류 발생";
            }
        }

        function initProbabilityUI() {
            const container = document.getElementById("probability-container");
            container.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                const className = model.getClassLabels()[i];
                const div = document.createElement("div");
                div.className = "bg-slate-800 p-2 rounded-lg border border-slate-700/60 text-xs";
                div.innerHTML = `
                    <div class="flex justify-between mb-1">
                        <span class="font-medium text-slate-300">${className}</span>
                        <span id="prob-val-${i}" class="text-slate-400">0%</span>
                    </div>
                    <div class="w-full bg-slate-700 rounded-full h-1.5">
                        <div id="prob-bar-${i}" class="bg-indigo-500 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        async function gameLoop(timestamp) {
            if (!isGameRunning) return;

            webcam.update();
            await predict();
            updateTimelineLogic();

            window.requestAnimationFrame(gameLoop);
        }

        async function predict() {
            // Pose Estimation
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let detectedPose = "";
            let highestProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                const prob = prediction[i].probability;
                const className = prediction[i].className;

                // Update UI Bars
                const probPercent = Math.round(prob * 100);
                document.getElementById(`prob-val-${i}`).innerText = `${probPercent}%`;
                document.getElementById(`prob-bar-${i}`).style.width = `${probPercent}%`;

                if (prob > highestProb) {
                    highestProb = prob;
                    detectedPose = className;
                }
            }

            // Draw Webcam & Skeleton Keypoints
            drawSkeleton(pose);

            // Compare Detected Pose with Expected Pose
            checkMatch(detectedPose, highestProb);
        }

        function updateTimelineLogic() {
            if (!player || typeof player.getCurrentTime !== 'function') return;

            const currentTime = player.getCurrentTime();
            
            // Format Time Display
            const mins = Math.floor(currentTime / 60);
            const secs = Math.floor(currentTime % 60);
            document.getElementById("time-display").innerText = 
                `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

            // Determine Expected Pose based on Video Timestamp
            const matchedPhase = POSE_TIMELINE.find(item => currentTime >= item.start && currentTime < item.end);
            if (matchedPhase) {
                currentExpectedPose = matchedPhase.pose;
            } else {
                currentExpectedPose = "REST";
            }

            document.getElementById("expected-pose").innerText = currentExpectedPose;
        }

        function checkMatch(detectedPose, confidence) {
            const matchBadge = document.getElementById("match-badge");
            const now = Date.now();

            // Pose match threshold: confidence > 75%
            const isMatch = (detectedPose === currentExpectedPose) && (confidence > 0.75) && (currentExpectedPose !== "REST");

            if (isMatch) {
                matchBadge.innerText = "일치! PERFECT";
                matchBadge.className = "px-4 py-2 rounded-lg font-bold text-sm bg-emerald-500/20 text-emerald-400 border border-emerald-500/50 pulse-glow";

                // Award points every 500ms while holding correct pose
                if (now - lastScoreTime > 500) {
                    combo++;
                    score += 10 + Math.min(combo, 10) * 2; // Extra points for high combo
                    lastScoreTime = now;

                    document.getElementById("score-text").innerText = score;
                    document.getElementById("combo-text").innerText = combo;
                }
            } else {
                matchBadge.innerText = detectedPose === currentExpectedPose ? "포즈 대기중" : "불일치";
                matchBadge.className = "px-4 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700";
                
                // Break combo if wrong pose during non-REST phase
                if (currentExpectedPose !== "REST" && confidence > 0.8 && detectedPose !== currentExpectedPose) {
                    combo = 0;
                    document.getElementById("combo-text").innerText = combo;
                }
            }
        }

        function drawSkeleton(pose) {
            if (ctx) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }

        function resetGame() {
            score = 0;
            combo = 0;
            document.getElementById("score-text").innerText = "0";
            document.getElementById("combo-text").innerText = "0";

            if (player && typeof player.seekTo === 'function') {
                player.seekTo(0);
                player.pauseVideo();
            }
        }
    </script>
</body>
</html>
